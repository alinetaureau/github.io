<style>

 y=\"13\" width=\"7\" height=\"7\" rx=\"2\"/><rect x=\"13\" y=\"13\" width=\"7\" height=\"7\" rx=\"2\"/><\/g><\/svg>", "illu": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"12\" fill=\"currentColor\"/><g transform=\"translate(5 5) scale(.5833)\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18.5 3.5 20.5 5.5 12 14l-2-2z\"/><path d=\"M10 14c-2.2 0-3.8 1.4-3.8 3.6 0 1.1-.9 2.1-2.2 2.1 1.9 1.2 6.4 1.4 7.6-1.3.6-1.4.2-3.1-1.6-4.4z\"/><\/g><\/svg>", "poster": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"12\" fill=\"currentColor\"/><g transform=\"translate(5 5) scale(.5833)\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5\"/><path d=\"M12 7.5l1.2 3.3 3.3 1.2-3.3 1.2L12 16.5l-1.2-3.3L7.5 12l3.3-1.2z\"/><\/g><\/svg>", "edition": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"12\" fill=\"currentColor\"/><g transform=\"translate(5 5) scale(.5833)\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 3h9l4 4v14H6z\"/><path d=\"M15 3v4h4M9 11h7M9 14.5h7M9 18h4\"/><\/g><\/svg>", "video": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"12\" fill=\"currentColor\"/><g transform=\"translate(5 5) scale(.5833)\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"9\" width=\"18\" height=\"12\" rx=\"2\"/><path d=\"M3.6 9 5 4.5l14.5-1.2L20.4 8\"/><path d=\"M8.5 4 10 8.6M13.5 3.6 15 8.2\"/><path d=\"M10.5 12.5v5l4.2-2.5z\"/><\/g><\/svg>", "insta": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"12\" fill=\"currentColor\"/><g transform=\"translate(5 5) scale(.5833)\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"5\"/><circle cx=\"12\" cy=\"12\" r=\"4\"/><circle cx=\"17.3\" cy=\"6.7\" r=\".6\"/><\/g><\/svg>", "shop": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"12\" fill=\"currentColor\"/><g transform=\"translate(5 5) scale(.5833)\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 8h14l-1.1 13H6.1z\"/><path d=\"M9 10V7a3 3 0 0 1 6 0v3\"/><\/g><\/svg>", "contact": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"12\" fill=\"currentColor\"/><g transform=\"translate(5 5) scale(.5833)\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 5h16v11h-9l-4.5 4v-4H4z\"/><path d=\"M8.5 10.5h.01M12 10.5h.01M15.5 10.5h.01\"/><\/g><\/svg>", "about": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"12\" fill=\"currentColor\"/><g transform=\"translate(5 5) scale(.5833)\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4.5 20.5c1.2-3.8 4-5.7 7.5-5.7s6.3 1.9 7.5 5.7\"/><\/g><\/svg>"}}</script>

<script id="hero7" type="application/json">{"green": "rgb(14,225,190)", "yetta": "hero/yetta-l.webp", "yetta_m": "hero/yetta-m.webp", "tb": "hero/tb-l.webp", "tb_m": "hero/tb-m.webp", "fhlo": "hero/fhlo-l.webp", "fhlo_m": "hero/fhlo-m.webp", "bliss": "hero/bliss-l.webp", "bliss_m": "hero/bliss-m.webp", "ripley": "hero/ripley-l.webp", "ripley_m": "hero/ripley-m.webp", "shop": "hero/shop-l.webp", "shop_m": "hero/shop-m.webp"}</script>
<script>const PRE = "";</script>
<script>
const P = JSON.parse(document.getElementById("data").textContent);
const I = JSON.parse(document.getElementById("icons").textContent)["2"];
const PROF = JSON.parse(document.getElementById("prof").textContent);
const PROF2 = JSON.parse(document.getElementById("prof2").textContent);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pad = n => String(n).padStart(2, "0");
const idx = t => P.findIndex(p => p.t === t);
const CHEV_R = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.28" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3l9 9-9 9"/></svg>';
const CHEV_L = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.28" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3l-9 9 9 9"/></svg>';
const SECS = [["all", "Tout", "Tout"], ["illu", "Digital painting", "Painting"], ["poster", "IA poster editing", "IA poster"]];
const SECN = Object.fromEntries(SECS.map(s => [s[0], s[1]]));
const HERO = JSON.parse(document.getElementById("hero7").textContent);
const SLIDES = [
  { cat: "poster", p: idx("Blissful Tide"), img: "bliss", pos: "52% 22%" },
  { cat: "shop" },
  { cat: "illu", p: idx("Trouble Makers"), img: "tb", bg: "#121118", pos: "50% 46%" },
  { cat: "poster", p: idx("Ripley In Between"), img: "ripley", pos: "45% 52%" },
  { cat: "poster", p: idx("Fhloston Paradise"), img: "fhlo", bg: HERO.green, pos: "50% 6%" },
  { cat: "illu", p: idx("Grandma Yetta"), img: "yetta", bg: "#f28a60", pos: "50% 42%" }];
let cur = 0, timer = null, cat = null;

/* ---------- menu du haut ---------- */
$("utilBar").innerHTML = [["about", "À propos", "#apropos"], ["shop", "Shop", "https://www.alinetaureau.shop"], ["insta", "Instagram", "https://www.instagram.com/alinetaureau/"], ["lang", "EN", "en/"]]
  .map(([k, l, u]) => `<a class="mi" href="${u}" ${u[0] === "h" ? 'target="_blank" rel="noopener"' : ""} aria-label="${k === "lang" ? "English version" : l}">${k === "lang" ? "" : `<span class="ico">${I[k]}</span>`}<span class="lbl">${l}</span></a>`).join("");
$("utilBar").querySelector('a[href="#apropos"]').addEventListener("click", e => { e.preventDefault(); openAbout(); });
// texte blanc tant que le menu passe sur la home, noir ensuite
new IntersectionObserver(([e]) => $("util").classList.toggle("on-dark", e.isIntersecting), { rootMargin: "-58px 0px -100% 0px" }).observe($("hero"));

/* ---------- signature / à propos ---------- */
const sig = document.querySelector(".sig");
const sigTone = () => sig.classList.toggle("on-dark", $("hero").getBoundingClientRect().bottom > innerHeight / 2);
addEventListener("scroll", sigTone, { passive: true }); addEventListener("resize", sigTone); let lastW = innerWidth; addEventListener("resize", () => { if (innerWidth !== lastW) { lastW = innerWidth; go(cur); } });
$("sigLink").addEventListener("click", e => { e.preventDefault(); openAbout(); });
function openAbout() { $("mpwrap").innerHTML = mpCard(0, PROF2); $("mpwrap").classList.add("vB"); mpWire($("mpwrap")); $("about").classList.add("open"); $("abX").focus(); }
$("abX").addEventListener("click", () => $("about").classList.remove("open"));
$("about").addEventListener("click", e => { if (e.target.id === "about") $("about").classList.remove("open"); });
addEventListener("keydown", e => { if (e.key === "Escape") $("about").classList.remove("open"); });

/* ---------- home ---------- */
const h = $("hero");
h.innerHTML = SLIDES.map((s, i) => {
  const shop = s.cat === "shop", p = shop ? null : P[s.p];
  const word = shop ? "Shop" : SECN[s.cat].replace(" ", "<br>");
  const key = shop ? "shop" : s.img, src = PRE + HERO[key], srcm = PRE + HERO[key + "_m"], pos = shop ? "50% 50%" : s.pos;
  const go = shop ? `<a class="cta" href="https://www.alinetaureau.shop" target="_blank" rel="noopener">Voir le shop →</a>` : `<button class="cta" data-go="${s.cat}">Voir la galerie ↓</button>`;
  return `<div class="slide ${i ? "" : "on"}" style="background:${s.bg || "#0d0d0e"}"><img class="full" src="${srcm}" srcset="${srcm} 1200w, ${src} 2400w" sizes="100vw" alt="" style="object-position:${pos}"${i ? ' loading="lazy"' : ' fetchpriority="high"'}><div class="txt"><div class="kick">${shop ? "alinetaureau.shop" : esc(p.t)}</div><div class="big">${word}</div>${go}</div></div>`;
}).join("") + `<div class="bars">${SLIDES.map(() => "<i><b></b></i>").join("")}</div><button class="next" id="next" aria-label="Image suivante">${CHEV_R}</button>`;
$("next").onclick = () => go(cur + 1);
h.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => { setCat(b.dataset.go); $("secnav").scrollIntoView({ behavior: "smooth" }); }));
function go(n) {
  const S = h.querySelectorAll(".slide"), B = h.querySelectorAll(".bars i"); cur = (n + S.length) % S.length;
  S.forEach((s, i) => s.classList.toggle("on", i === cur));
  B.forEach((b, i) => b.className = i < cur ? "done" : ""); void B[cur].offsetWidth; B[cur].className = "run";
  clearTimeout(timer); if (!h.classList.contains("paused")) timer = setTimeout(() => go(cur + 1), 6000);
}
go(0); sigTone();
{ const beats = [9000, 4000]; let bi = 0;
  const glitch = () => { if (matchMedia("(prefers-reduced-motion: reduce)").matches) return; [sig, $("util")].forEach(e => e.classList.add("gl")); setTimeout(() => [sig, $("util")].forEach(e => e.classList.remove("gl")), 520); };
  const tick = () => setTimeout(() => { glitch(); bi ^= 1; tick(); }, beats[bi]); tick(); }


/* ---------- sections ---------- */
$("secBar").innerHTML = SECS.map(([k, l, s]) => `<button class="mi sec" data-c="${k}" aria-pressed="false"><span class="ico">${I[k]}</span><span class="long">${l}</span><span class="short">${s}</span></button>`).join("");
$("secBar").querySelectorAll(".sec").forEach(b => b.addEventListener("click", () => { setCat(b.dataset.c === "all" ? null : b.dataset.c); $("secnav").scrollIntoView({ behavior: "smooth" }); }));
function layout() {
  const n = innerWidth >= 1900 ? 3 : innerWidth >= 700 ? 2 : 1, cols = [], hgt = [];
  for (let k = 0; k < n; k++) { const c = document.createElement("div"); c.className = "col"; cols.push(c); hgt.push(0); }
  TILES.forEach(t => { if (t.classList.contains("hidden")) return; let k = hgt.indexOf(Math.min(...hgt)); cols[k].appendChild(t); hgt[k] += (+t.dataset.r || 1) + .08; });
  $("grid").replaceChildren(...cols);
}
let colsN = 0; addEventListener("resize", () => { const n = innerWidth >= 1900 ? 3 : innerWidth >= 700 ? 2 : 1; if (n !== colsN) { colsN = n; layout(); } });
const TILES = [];
function setCat(c) {
  cat = c;
  $("secBar").querySelectorAll(".sec").forEach(b => b.setAttribute("aria-pressed", b.dataset.c === (cat || "all")));
  TILES.forEach(t => t.classList.toggle("hidden", !!cat && !P[+t.dataset.i].tags.includes(cat)));
  layout();
}

setCat(null);
/* ---------- galerie ---------- */
const g = $("grid");
// ordre aléatoire à chaque chargement (mélange de Fisher-Yates)
const ORDER = P.map((_, i) => i);
// les affiches IA remontent plutôt en haut, mélangées aux illustrations
const KEY = ORDER.map(i => Math.random() + (P[i].tags.includes("poster") ? 0 : 0.3));
ORDER.sort((x, y) => KEY[x] - KEY[y]);
ORDER.forEach(i => { const p = P[i];
  if (p.anim) return; // vidéos mises de côté pour le moment
  const t = document.createElement("article"); t.className = "tile"; t.dataset.i = i;
  if (p.anim) {
    t.classList.add("vid");
    t.innerHTML = `<div class="frame" style="aspect-ratio:${p.w}/${p.h}"><img src="${p.anim}" alt="${esc(p.t)}"></div><div class="cap"><b>${esc(p.t)}</b><span>Pub vidéo</span></div>`;
    t.dataset.r = (p.steps[0].h / p.steps[0].w).toFixed(3); TILES.push(t); return;
  }
  t.classList.add("proj");
  const s0 = p.steps[0], n = p.steps.length;
  t.innerHTML = `<div class="frame" style="aspect-ratio:${s0.w}/${s0.h}"><img class="main" src="${PRE + s0.big}" srcset="${PRE + s0.big} 960w, ${PRE + s0.lg} 1700w" sizes="(min-width: 1900px) 31vw, (min-width: 700px) 46vw, 92vw" width="${s0.w}" height="${s0.h}" alt="${esc(p.t)}" loading="lazy" decoding="async">
    ${p.steps.slice(1).map((s, j) => `<div class="step" data-k="${j + 1}"><div class="blur" style="background-image:url(${PRE + s.th})"></div><img src="${PRE + s.big}" alt="${esc(p.t)} – ${esc(s.l)}" loading="lazy"></div>`).join("")}
    ${n > 1 ? `<div class="shade"></div><button class="nav p" aria-label="Étape précédente">${CHEV_L}</button><span class="lab">01 / ${pad(n)} · ${esc(p.steps[0].l)}</span><button class="nav n" aria-label="Étape suivante">${CHEV_R}</button>` : ""}</div>
    <div class="cap"><b>${esc(p.t)}</b><span>${p.tags.map(x => SECN[x]).join(" · ")}${n > 1 ? " · " + n + " étapes" : ""}</span></div>`;
  if (n > 1) {
    let k = 0; const fr = t.querySelector(".frame");
    const show = nk => { k = (nk + n) % n; t.classList.toggle("walked", k > 0); fr.querySelectorAll(".step").forEach(st => st.classList.toggle("on", +st.dataset.k === k)); fr.querySelector(".lab").textContent = `${pad(k + 1)} / ${pad(n)} · ${p.steps[k].l}`; };
    fr.querySelector(".nav.p").addEventListener("click", e => { e.stopPropagation(); show(k - 1); });
    fr.querySelector(".nav.n").addEventListener("click", e => { e.stopPropagation(); show(k + 1); });
    fr.addEventListener("click", () => show(k + 1)); fr.style.cursor = "pointer";
  }
  t.dataset.r = (p.steps[0].h / p.steps[0].w).toFixed(3); TILES.push(t);
});
colsN = innerWidth >= 1900 ? 3 : innerWidth >= 700 ? 2 : 1; layout();
</script>
